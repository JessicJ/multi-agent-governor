name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate evaluation manifest
        run: python -m magov.eval_cli validate evals/pilot_manifest.json --workspace .

      - name: Run CLI smoke tests
        run: |
          magov examples/research_task.json > /tmp/research-result.json
          magov examples/coupled_task.json > /tmp/coupled-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          research = json.loads(Path("/tmp/research-result.json").read_text())
          coupled = json.loads(Path("/tmp/coupled-result.json").read_text())
          assert research["mode"] == "independent"
          assert research["total_agents"] == 3
          assert coupled["mode"] == "single"
          PY

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
