name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate evaluation manifest
        run: python -m magov.eval_cli validate evals/pilot_manifest.json --workspace .

      - name: Validate source tree
        run: |
          python -m compileall -q src tests \
            plugins/multi-agent-governor/skills/multi-agent-governor/scripts
          python tools/check_markdown_links.py .
          git diff --check

      - name: Run CLI smoke tests
        run: |
          magov plan examples/research_task.json > /tmp/research-result.json
          magov plan examples/coupled_task.json > /tmp/coupled-result.json
          magov advisory start examples/advisory_session_start.json \
            --events /tmp/magov-advisory.events.jsonl \
            > /tmp/advisory-start.json
          magov advisory checkpoint /tmp/magov-advisory.events.jsonl \
            examples/advisory_checkpoint_agent_2.json \
            > /tmp/advisory-agent-2.json
          magov advisory checkpoint /tmp/magov-advisory.events.jsonl \
            examples/advisory_checkpoint_agent_3.json \
            > /tmp/advisory-agent-3.json
          magov advisory report /tmp/magov-advisory.events.jsonl \
            > /tmp/advisory-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          research = json.loads(Path("/tmp/research-result.json").read_text())
          coupled = json.loads(Path("/tmp/coupled-result.json").read_text())
          advisory = json.loads(Path("/tmp/advisory-report.json").read_text())
          assert research["mode"] == "independent"
          assert research["total_agents"] == 3
          assert coupled["mode"] == "single"
          assert advisory["status"] == "completed"
          assert advisory["planned_total_agents"] == 3
          assert advisory["actual_total_agents"] == 3
          assert advisory["plan_stop_reason"] == "cost_budget_reached"
          assert advisory["final_stop_reason"] == "target_reached"
          assert advisory["usage"]["total_tokens"] is None
          assert advisory["runtime_enforced"] is False
          PY

  package:
    name: Package distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --requirement requirements/release.txt

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata and licenses
        run: |
          python -m twine check dist/*
          python tools/check_distribution.py dist/*

      - name: Test source distribution
        run: |
          mkdir /tmp/magov-sdist-smoke
          tar -xzf dist/*.tar.gz -C /tmp/magov-sdist-smoke
          cd /tmp/magov-sdist-smoke/multi_agent_governor-*
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/magov-wheel-smoke
          /tmp/magov-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/magov-wheel-smoke/bin/magov --help
          /tmp/magov-wheel-smoke/bin/magov-eval --help
          /tmp/magov-wheel-smoke/bin/magov plan \
            examples/research_task.json --compact
          /tmp/magov-wheel-smoke/bin/magov advisory start \
            examples/advisory_session_start.json \
            --events /tmp/magov-wheel-advisory.events.jsonl
          /tmp/magov-wheel-smoke/bin/magov advisory checkpoint \
            /tmp/magov-wheel-advisory.events.jsonl \
            examples/advisory_checkpoint_agent_2.json
          /tmp/magov-wheel-smoke/bin/magov advisory checkpoint \
            /tmp/magov-wheel-advisory.events.jsonl \
            examples/advisory_checkpoint_agent_3.json
          /tmp/magov-wheel-smoke/bin/magov advisory report \
            /tmp/magov-wheel-advisory.events.jsonl
          /tmp/magov-wheel-smoke/bin/magov run \
            examples/runtime_review_scripted_v2.json \
            --events /tmp/magov-wheel-smoke.events.jsonl
          /tmp/magov-wheel-smoke/bin/magov replay \
            /tmp/magov-wheel-smoke.events.jsonl
