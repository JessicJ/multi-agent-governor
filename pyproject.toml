[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-governor"
version = "0.1.0"
description = "A lightweight, explainable controller that decides whether a task should use multiple agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Multi-Agent Governor contributors"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/JessicJ/multi-agent-governor"
Repository = "https://github.com/JessicJ/multi-agent-governor"
Issues = "https://github.com/JessicJ/multi-agent-governor/issues"

[project.scripts]
magov = "magov.cli:main"
magov-eval = "magov.eval_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
